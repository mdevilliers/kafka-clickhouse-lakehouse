services:

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_LISTENERS: 'CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-topic-setup:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        echo "Creating topic 'events'..."
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create --if-not-exists \
          --topic events \
          --partitions 1 \
          --replication-factor 1
        echo "Topics now:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.81
    ports:
      - "9900:9900"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-polaris_root}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-polaris_pass}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9900"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9900/health && curl --fail http://127.0.0.1:9001/rustfs/console/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bucket-setup:
    image: amazon/aws-cli:2.35.11
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-polaris_root}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-polaris_pass}
      AWS_ENDPOINT_URL: http://rustfs:9900
      AWS_DEFAULT_REGION: us-west-2
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Creating RustFS bucket 'warehouse'..."
        aws s3api create-bucket --bucket warehouse 2>/dev/null || echo "(bucket already exists)"
        aws s3 ls
        echo "Bucket setup complete."

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak/iceberg-realm.json:/opt/keycloak/data/import/iceberg-realm.json
    command:
      - "start-dev"
      - "--import-realm"
      - "--health-enabled=true"
    healthcheck:
      test: "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 2s
      retries: 15

  polaris:
    image: apache/polaris:latest
    ports:
      - "8181:8181"
      - "8182:8182"
    depends_on:
      rustfs:
        condition: service_healthy
      bucket-setup:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-polaris_root}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-polaris_pass}
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,${ROOT_CLIENT_ID:-root},${ROOT_CLIENT_SECRET:-s3cr3t}
      polaris.realm-context.realms: ${POLARIS_REALM:-POLARIS}
      quarkus.otel.sdk.disabled: "true"
      polaris.authentication.type: mixed
      quarkus.oidc.tenant-enabled: "true"
      quarkus.oidc.auth-server-url: http://keycloak:8080/realms/iceberg
      quarkus.oidc.token.issuer: http://localhost:8080/realms/iceberg
      quarkus.oidc.client-id: polaris-console
      quarkus.oidc.roles.role-claim-path: principal_roles
      polaris.oidc.principal-mapper.id-claim-path: principal_id
      polaris.oidc.principal-mapper.name-claim-path: principal_name
      polaris.oidc.principal-roles-mapper.mappings[0].regex: (.+)
      polaris.oidc.principal-roles-mapper.mappings[0].replacement: PRINCIPAL_ROLE:$$1
      polaris.readiness.ignore-severe-issues: "true"
      quarkus.http.cors.enabled: "true"
      quarkus.http.cors.origins: "http://localhost:4000"
      quarkus.http.cors.methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
      quarkus.http.cors.headers: "authorization,content-type,polaris-realm,accept,x-iceberg-access-delegation"
      quarkus.http.cors.access-control-allow-credentials: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 10s

  polaris-setup:
    image: alpine/curl:8.20.0
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      - CLIENT_ID=${ROOT_CLIENT_ID:-root}
      - CLIENT_SECRET=${ROOT_CLIENT_SECRET:-s3cr3t}
      - CATALOG_NAME=${CATALOG_NAME:-quickstart_catalog}
      - REALM=${POLARIS_REALM:-POLARIS}
      - USER_CLIENT_ID=${USER_CLIENT_ID:-quickstart_user}
      - USER_CLIENT_SECRET=${USER_CLIENT_SECRET:-quickstart_pass}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        apk add --no-cache jq

        echo "Obtaining root access token..."
        TOKEN_RESPONSE=$$(curl --fail-with-body -s -S -X POST http://polaris:8181/api/catalog/v1/oauth/tokens \
          -H 'Content-Type: application/x-www-form-urlencoded' \
          -d "grant_type=client_credentials&client_id=$${CLIENT_ID}&client_secret=$${CLIENT_SECRET}&scope=PRINCIPAL_ROLE:ALL")
        TOKEN=$$(echo $$TOKEN_RESPONSE | jq -r '.access_token')
        echo "Got token"

        echo "Creating catalog '$$CATALOG_NAME' in realm $$REALM..."
        PAYLOAD='{
          "catalog": {
            "name": "'$$CATALOG_NAME'",
            "type": "INTERNAL",
            "readOnly": false,
            "properties": {
              "default-base-location": "s3://warehouse"
            },
            "storageConfigInfo": {
              "storageType": "S3",
              "allowedLocations": ["s3://warehouse"],
              "endpoint": "http://rustfs:9900",
              "endpointInternal": "http://rustfs:9900",
              "pathStyleAccess": true,
              "region": "us-west-2"
            }
          }
        }'
        curl --fail-with-body -s -S -X POST http://polaris:8181/api/management/v1/catalogs \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -H "Polaris-Realm: $$REALM" \
          -d "$$PAYLOAD" || echo "(catalog may already exist)"
        echo "Catalog ready"

        echo "Creating principal 'quickstart_user'..."
        curl -s -X POST http://polaris:8181/api/management/v1/principals \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Polaris-Realm: $$REALM" \
          -H "Content-Type: application/json" \
          -d '{"principal": {"name": "quickstart_user", "properties": {}}}' || true

        echo "Setting fixed credentials on quickstart_user..."
        curl --fail-with-body -s -X POST http://polaris:8181/api/management/v1/principals/quickstart_user/reset \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Polaris-Realm: $$REALM" \
          -H "Content-Type: application/json" \
          -d "{\"clientId\": \"$$USER_CLIENT_ID\", \"clientSecret\": \"$$USER_CLIENT_SECRET\"}"
        echo "Principal credentials set"

        echo "Creating principal role 'quickstart_user_role'..."
        curl -s -S -X POST http://polaris:8181/api/management/v1/principal-roles \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Polaris-Realm: $$REALM" \
          -H "Content-Type: application/json" \
          -d '{"principalRole": {"name": "quickstart_user_role", "properties": {}}}' || true

        echo "Creating catalog role 'quickstart_catalog_role'..."
        curl -s -S -X POST http://polaris:8181/api/management/v1/catalogs/$$CATALOG_NAME/catalog-roles \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Polaris-Realm: $$REALM" \
          -H "Content-Type: application/json" \
          -d '{"catalogRole": {"name": "quickstart_catalog_role", "properties": {}}}' || true

        echo "Assigning principal role to principal..."
        curl --fail-with-body -s -S -X PUT http://polaris:8181/api/management/v1/principals/quickstart_user/principal-roles \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Polaris-Realm: $$REALM" \
          -H "Content-Type: application/json" \
          -d '{"principalRole": {"name": "quickstart_user_role"}}'

        echo "Assigning catalog role to principal role..."
        curl --fail-with-body -s -S -X PUT http://polaris:8181/api/management/v1/principal-roles/quickstart_user_role/catalog-roles/$$CATALOG_NAME \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Polaris-Realm: $$REALM" \
          -H "Content-Type: application/json" \
          -d '{"catalogRole": {"name": "quickstart_catalog_role"}}'

        echo "Granting CATALOG_MANAGE_CONTENT privilege..."
        curl --fail-with-body -s -S -X PUT http://polaris:8181/api/management/v1/catalogs/$$CATALOG_NAME/catalog-roles/quickstart_catalog_role/grants \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Polaris-Realm: $$REALM" \
          -H "Content-Type: application/json" \
          -d '{"type": "catalog", "privilege": "CATALOG_MANAGE_CONTENT"}'

        echo "Fetching user token to create Iceberg namespace + table..."
        USER_TOKEN=$$(curl -s -X POST http://polaris:8181/api/catalog/v1/oauth/tokens \
          -H 'Content-Type: application/x-www-form-urlencoded' \
          -d "grant_type=client_credentials&client_id=$${USER_CLIENT_ID}&client_secret=$${USER_CLIENT_SECRET}&scope=PRINCIPAL_ROLE:ALL" \
          | jq -r '.access_token')

        echo "Creating namespace 'default'..."
        curl -s -X POST http://polaris:8181/api/catalog/v1/$$CATALOG_NAME/namespaces \
          -H "Authorization: Bearer $$USER_TOKEN" \
          -H "Polaris-Realm: $$REALM" \
          -H "Content-Type: application/json" \
          -d '{"namespace": ["default"], "properties": {}}' || echo "(namespace may already exist)"

        echo "Creating Iceberg table 'default.events'..."
        curl -s -X POST http://polaris:8181/api/catalog/v1/$$CATALOG_NAME/namespaces/default/tables \
          -H "Authorization: Bearer $$USER_TOKEN" \
          -H "Polaris-Realm: $$REALM" \
          -H "Content-Type: application/json" \
          -d '{
            "name": "events",
            "schema": {
              "type": "struct",
              "fields": [
                {"id": 1, "name": "id",  "type": "long",      "required": false},
                {"id": 2, "name": "msg", "type": "string",    "required": false},
                {"id": 3, "name": "ts",  "type": "timestamp", "required": false}
              ]
            }
          }' || echo "(table may already exist)"

        echo ""
        echo "=========================================="
        echo "Polaris bootstrap complete"
        echo "=========================================="
        echo "Catalog:        $$CATALOG_NAME  (s3://warehouse)"
        echo "User client ID: $$USER_CLIENT_ID"
        echo "User secret:    $$USER_CLIENT_SECRET"
        echo "Token endpoint: http://localhost:8181/api/catalog/v1/oauth/tokens"
        echo "=========================================="

        touch /tmp/polaris-setup-done
        tail -f /dev/null
    healthcheck:
      interval: 2s
      timeout: 5s
      retries: 60
      test: ["CMD", "test", "-f", "/tmp/polaris-setup-done"]

  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    ports:
      - "8123:8123"
      - "9000:9000"
    depends_on:
      polaris-setup:
        condition: service_healthy
      kafka-topic-setup:
        condition: service_completed_successfully
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - ./clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  polaris-console:
    image: polaris-console:local
    build:
      context: https://github.com/apache/polaris-tools.git#main:console
      dockerfile: docker/Dockerfile
    ports:
      - "4000:8080"
    depends_on:
      polaris:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      VITE_POLARIS_API_URL: http://localhost:8181
      VITE_POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      VITE_POLARIS_PRINCIPAL_SCOPE: PRINCIPAL_ROLE:ALL
      VITE_POLARIS_REALM_HEADER_NAME: Polaris-Realm
      VITE_OAUTH_TOKEN_URL: http://localhost:8181/api/catalog/v1/oauth/tokens
      VITE_OIDC_ISSUER_URL: http://localhost:8080/realms/iceberg
      VITE_OIDC_CLIENT_ID: polaris-console
      VITE_OIDC_REDIRECT_URI: http://localhost:4000/auth/callback
      VITE_OIDC_SCOPE: "openid profile email"
